<!doctype html>
<html lang="zh-Hant">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>登入｜BookHub</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <header class="site-header"><a class="brand" href="/">Book<span>Hub</span><small>校園二手書市集</small></a><a
            class="back-link" href="/">← 返回首頁</a></header>
    <main class="auth-layout">
        <section class="auth-art"><span class="eyebrow">YOUR CAMPUS. YOUR BOOKS.</span>
            <div>
                <div class="auth-symbol"> </div>
                <!-- <h1>舊書新讀，<br>故事繼續。</h1>
                <p>GOOD BOOKS FIND NEW PEOPLE.</p> -->

                <div class="login-mascot">
    <img
        src="{{ url_for('static', filename='images/bookhub-mascot.png') }}"
        alt="BookHub Mascot"
    >
</div>


            </div><small>BOOKHUB · A BETTER WAY TO PASS IT ON.</small>
        </section>


        <section class="auth-content">
            <div class="auth-form"><span class="eyebrow">WELCOME BACK / 01</span>
                <h2>歡迎回來！</h2>
                <p class="intro">登入 BookHub，繼續探索校園裡的好書。</p>
                <form id="loginForm"><label for="email">電子郵件</label><input id="email" type="email" autocomplete="email"
                        placeholder="you@example.com" required><label for="password">密碼</label><input id="password"
                        type="password" autocomplete="current-password" placeholder="請輸入密碼" required><button
                        class="btn btn-green submit" type="submit">登入 <span>↗</span></button></form>ญ
                        <p>Seller</p>
                <p>User : jab@gmail.com</p>
                <p>Password : JJJJ1234</p>
                <p>-------</p>
                <p>Buyer</p>
                 <p>User : waruntorn04@gmail.com</p>
                <p>Password : mudeng888</p>
               
                        <p class="form-message" id="message" role="alert"></p>
                <div class="form-switch">還沒有帳號？ <a href="/register">立即註冊 ↗</a></div>
            </div>
        </section>
    </main>
    <script>document.getElementById('loginForm').addEventListener('submit', async e => { e.preventDefault(); const msg = document.getElementById('message'); const btn = e.currentTarget.querySelector('button'); msg.textContent = ''; btn.disabled = true; try { const response = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) }); const result = await response.json(); if (response.ok) { location.assign('/dashboard') } else { msg.textContent = result.error === 'Invalid email or password' ? '電子郵件或密碼不正確' : (result.error || '登入失敗，請稍後再試。') } } catch { msg.textContent = '無法連線至伺服器，請稍後再試。' } finally { btn.disabled = false } });</script>
</body>

</html>
